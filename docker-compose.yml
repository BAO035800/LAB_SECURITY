# Lab02 An ninh mạng — ARP Cache Poisoning
# Topology đúng template: 3 máy cùng 1 LAN
#   User 10.0.1.20  |  Server 10.0.1.30  |  Attacker 10.0.1.10
#
# Chạy:       docker compose up -d --build
# Vào máy:    docker exec -it attacker bash   (hoặc user / server)
# Bắt gói:    Wireshark chọn interface "lab-lan1" trên máy host

services:
  user:
    build: { context: ., dockerfile: Dockerfile.node }
    image: lab-node
    container_name: user
    hostname: user
    cap_add: [NET_ADMIN]
    command: >
      bash -c "/usr/sbin/sshd; sleep infinity"
    networks:
      lan1: { ipv4_address: 10.0.1.20 }

  server:
    build: { context: ., dockerfile: Dockerfile.node }
    image: lab-node
    container_name: server
    hostname: server
    cap_add: [NET_ADMIN]
    command: >
      bash -c "/usr/sbin/sshd; nginx -g 'daemon off;'"
    networks:
      lan1: { ipv4_address: 10.0.1.30 }

  attacker:
    build: { context: ., dockerfile: Dockerfile.attacker }
    image: lab-attacker
    container_name: attacker
    hostname: attacker
    cap_add: [NET_ADMIN, NET_RAW]
    # Mặc định KHÔNG forward. Bật khi làm MITM (Kịch bản 3):
    #   sysctl -w net.ipv4.ip_forward=1
    command: >
      bash -c "/usr/sbin/sshd; sleep infinity"
    networks:
      lan1: { ipv4_address: 10.0.1.10 }

networks:
  lan1:
    # Bỏ internal: true để host SSH thẳng vào IP container (10.0.1.x).
    # Đổi lại: container ra được internet. Không ảnh hưởng tấn công ARP ở tầng 2.
    driver_opts:
      com.docker.network.bridge.name: lab-lan1   # tên bridge để bắt gói bằng Wireshark
    ipam:
      config: [{ subnet: 10.0.1.0/24 }]